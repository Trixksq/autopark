xt><polyline points="290,670 290,704" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><polygon points="168.0,704.0 448.0,704.0 412.0,756.0 132.0,756.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="290" y="721.0">Повернути True</tspan><tspan x="290" y="739.0">(конфлікт)</tspan></text><polygon points="543.0,686.0 773.0,686.0 737.0,738.0 507.0,738.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="640" y="703.0">Повернути False</tspan><tspan x="640" y="721.0">(конфлікту немає)</tspan></text><polyline points="290,756 290,808" fill="none" stroke="black" stroke-width="1.4"/><polyline points="640,738 640,790 290,790" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><polyline points="290,790 290,816" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><rect x="200.0" y="818.0" width="180" height="40" rx="20.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="290" y="838.0">Кінець</tspan></text></svg>