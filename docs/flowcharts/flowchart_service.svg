<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980"><title>Рисунок 2.3 – Блок-схема розрахунку термінів ТО</title><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="220.0" y="18.0" width="160" height="44" rx="22.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="40.0">Початок</tspan></text><polyline points="300,62 300,98" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><polygon points="168.0,98.0 468.0,98.0 432.0,146.0 132.0,146.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="113.0">Список авто vehicles</tspan><tspan x="300" y="131.0">(результат пошуку і фільтра)</tspan></text><polyline points="300,146 300,182" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><rect x="170.0" y="182.0" width="260" height="44" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="204.0">today ← date.today()</tspan></text><polyline points="300,226 300,262" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><polygon points="152.0,262.0 448.0,262.0 460.0,274.0 460.0,310.0 140.0,310.0 140.0,274.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="277.0">Цикл А:</tspan><tspan x="300" y="295.0">для кожного vehicle у vehicles</tspan></text><polyline points="300,310 300,346" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><rect x="120.0" y="346.0" width="360" height="52" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="372.0">interval ← vehicle.service_interval_days()</tspan></text><line x1="130.0" y1="346.0" x2="130.0" y2="398.0" stroke="black" stroke-width="1.4"/><line x1="470.0" y1="346.0" x2="470.0" y2="398.0" stroke="black" stroke-width="1.4"/><line x1="480" y1="372" x2="500" y2="372" stroke="black" stroke-dasharray="5,4"/><polyline points="510,342.0 500,342.0 500,402.0 510,402.0" fill="none" stroke="black" stroke-width="1.2"/><text text-anchor="start" dominant-baseline="middle" font-family="Times New Roman" font-size="13" ><tspan x="508" y="356.4">Поліморфний виклик:</tspan><tspan x="508" y="372.0">Car – 365, Truck – 180,</tspan><tspan x="508" y="387.6">Bus – 120 днів</tspan></text><polyline points="300,398 300,434" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><rect x="120.0" y="434.0" width="360" height="52" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="451.0">next ← vehicle.last_service + interval днів</tspan><tspan x="300" y="469.0">(next_service_date)</tspan></text><polyline points="300,486 300,522" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><rect x="120.0" y="522.0" width="360" height="52" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="539.0">days ← (next − today).days</tspan><tspan x="300" y="557.0">(days_until_service)</tspan></text><polyline points="300,574 300,604" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><polygon points="300,604.0 420.0,650 300,696.0 180.0,650" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="641.0">days ≤ 0 ?</tspan><tspan x="300" y="659.0">(is_service_due)</tspan></text><polyline points="420,650 560,650 560,676" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><text text-anchor="start" dominant-baseline="middle" font-family="Times New Roman" font-size="14" ><tspan x="428" y="638.0">так</tspan></text><rect x="445.0" y="676.0" width="230" height="56" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="560" y="695.0">Позначити рядок</tspan><tspan x="560" y="713.0">тегом «due» (червоний)</tspan></text><text text-anchor="start" dominant-baseline="middle" font-family="Times New Roman" font-size="14" ><tspan x="308" y="714.0">ні</tspan></text><polyline points="300,696 300,760" fill="none" stroke="black" stroke-width="1.4"/><polyline points="560,732 560,760 300,760" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><polyline points="300,760 300,786" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><polygon points="128.0,786.0 508.0,786.0 472.0,838.0 92.0,838.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="803.0">Рядок таблиці: тип, номер, марка, рік, пробіг,</tspan><tspan x="300" y="821.0">останнє ТО, наступне ТО, днів до ТО</tspan></text><polyline points="300,838 300,868" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><polygon points="140.0,868.0 460.0,868.0 460.0,904.0 448.0,916.0 152.0,916.0 140.0,904.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="892.0">Цикл А</tspan></text><polyline points="300,916 300,938" fill="none" stroke="black" stroke-width="1.4" marker-end="url(#a)"/><rect x="220.0" y="936.0" width="160" height="40" rx="20.0" fill="white" stroke="black" stroke-width="1.4"/><text text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-size="15" ><tspan x="300" y="956.0">Кінець</tspan></text></svg>